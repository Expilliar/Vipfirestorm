<script>
/* ============================================================
   FIREBASE RTDB REST
   ============================================================ */
const FB_URL = 'https://vipfirestorm-ee1f6-default-rtdb.firebaseio.com';
const POLL_MS = 7000;

let FB_DATA = { users: {}, reviews: {}, chat: {}, bans: {} };
let FB_READY = false;
let POLL_TIMER = null;

function setCloudStatus(state, text) {
  const chip = document.getElementById('cloudChip');
  const txt = document.getElementById('cloudChipText');
  if (!chip) return;
  chip.classList.remove('online', 'offline', 'error');
  chip.classList.add(state === 'online' ? 'online' : state === 'error' ? 'error' : 'offline');
  if (txt) txt.textContent = text || (state === 'online' ? 'Облако' : state === 'error' ? 'Ошибка' : 'Локально');
}

async function fbFetch(path, opts) {
  const r = await fetch(`${FB_URL}/${path}.json`, opts || { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function fbPut(path, data) {
  return fbFetch(path, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
}
async function fbDelete(path) {
  try {
    const r = await fetch(`${FB_URL}/${path}.json`, { method: 'DELETE' });
    return r.ok;
  } catch (e) { return false; }
}

async function fbLoadAll() {
  try {
    const d = await fbFetch('') || {};
    FB_DATA = {
      users:   d.users   && typeof d.users   === 'object' ? d.users   : {},
      reviews: d.reviews && typeof d.reviews === 'object' ? d.reviews : {},
      chat:    d.chat    && typeof d.chat    === 'object' ? d.chat    : {},
      bans:    d.bans    && typeof d.bans    === 'object' ? d.bans    : {}
    };
    FB_READY = true;
    setCloudStatus('online');
    return true;
  } catch (e) {
    console.warn('[FB] load error:', e.message);
    FB_READY = false;
    setCloudStatus('error', 'Ошибка');
    return false;
  }
}

/* ============================================================
   LOCAL STORAGE keys
   ============================================================ */
const K_SESSION      = 'vf_session_v1';
const K_EDITS        = 'vf_edits_v1';
const K_LAYOUT       = 'vf_layout_v1';
const K_LOCAL_USERS  = 'vf_users_v1';
const K_LOCAL_REVIEWS= 'vf_reviews_v1';
const K_LOCAL_CHAT   = 'vf_chat_v1';
const K_LOCAL_BANS   = 'vf_bans_v1';
const CHAT_MAX       = 500;
const CREATOR_NICKNAME = 'ищусебя';

function safeGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } }
function safeRemove(k){ try { localStorage.removeItem(k); } catch(e){} }
function loadJSON(k, fb){ const r = safeGet(k); if(!r) return fb; try { return JSON.parse(r) || fb; } catch(e){ return fb; } }

/* ============================================================
   STORAGE — users
   ============================================================ */
function loadUsers() {
  if (FB_READY) return Object.values(FB_DATA.users || {}).filter(Boolean);
  return loadJSON(K_LOCAL_USERS, []);
}
function saveUser(user) {
  if (!user || !user.id) return;
  if (FB_READY) {
    FB_DATA.users[user.id] = user;
    fbPut('users/' + user.id, user);
  }
  const arr = loadJSON(K_LOCAL_USERS, []);
  const i = arr.findIndex(u => u.id === user.id);
  if (i >= 0) arr[i] = user; else arr.push(user);
  safeSet(K_LOCAL_USERS, JSON.stringify(arr));
}
function saveUsers(arr) {
  if (!Array.isArray(arr)) return;
  arr.forEach(saveUser);
}
function deleteUserFromDb(id) {
  if (FB_READY) { delete FB_DATA.users[id]; fbDelete('users/' + id); }
  const arr = loadJSON(K_LOCAL_USERS, []).filter(u => u.id !== id);
  safeSet(K_LOCAL_USERS, JSON.stringify(arr));
}

/* reviews */
function loadReviews() {
  if (FB_READY) return Object.values(FB_DATA.reviews || {}).filter(Boolean);
  return loadJSON(K_LOCAL_REVIEWS, []);
}
function saveReview(review) {
  if (!review || !review.id) return;
  if (FB_READY) { FB_DATA.reviews[review.id] = review; fbPut('reviews/' + review.id, review); }
  const arr = loadJSON(K_LOCAL_REVIEWS, []);
  const i = arr.findIndex(r => r.id === review.id);
  if (i >= 0) arr[i] = review; else arr.unshift(review);
  safeSet(K_LOCAL_REVIEWS, JSON.stringify(arr));
}
function saveReviews(arr){ if (Array.isArray(arr)) arr.forEach(saveReview); }
function deleteReviewFromDb(id) {
  if (FB_READY) { delete FB_DATA.reviews[id]; fbDelete('reviews/' + id); }
  const arr = loadJSON(K_LOCAL_REVIEWS, []).filter(r => r.id !== id);
  safeSet(K_LOCAL_REVIEWS, JSON.stringify(arr));
}

/* chat */
function loadChat() {
  if (FB_READY) {
    return Object.values(FB_DATA.chat || {}).filter(Boolean)
      .sort((a, b) => (a.date || '') < (b.date || '') ? -1 : 1);
  }
  return loadJSON(K_LOCAL_CHAT, []);
}
function saveMessage(msg) {
  if (!msg || !msg.id) return;
  if (FB_READY) { FB_DATA.chat[msg.id] = msg; fbPut('chat/' + msg.id, msg); }
  let arr = loadJSON(K_LOCAL_CHAT, []);
  arr.push(msg);
  if (arr.length > CHAT_MAX) arr = arr.slice(-CHAT_MAX);
  safeSet(K_LOCAL_CHAT, JSON.stringify(arr));
}
function deleteMessageFromDb(id) {
  if (FB_READY) { delete FB_DATA.chat[id]; fbDelete('chat/' + id); }
  const arr = loadJSON(K_LOCAL_CHAT, []).filter(m => m.id !== id);
  safeSet(K_LOCAL_CHAT, JSON.stringify(arr));
}

/* bans */
function loadBans() {
  if (FB_READY) return JSON.parse(JSON.stringify(FB_DATA.bans || {}));
  return loadJSON(K_LOCAL_BANS, {});
}
function saveBans(obj) {
  if (!obj || typeof obj !== 'object') return;
  if (FB_READY) {
    Object.keys(obj).forEach(uid => {
      FB_DATA.bans[uid] = obj[uid];
      fbPut('bans/' + uid, obj[uid]);
    });
  }
  safeSet(K_LOCAL_BANS, JSON.stringify(obj));
}
function saveBan(userId, ban) {
  if (FB_READY) { FB_DATA.bans[userId] = ban; fbPut('bans/' + userId, ban); }
  const obj = loadJSON(K_LOCAL_BANS, {});
  obj[userId] = ban;
  safeSet(K_LOCAL_BANS, JSON.stringify(obj));
}
function deleteBan(userId) {
  if (FB_READY) { delete FB_DATA.bans[userId]; fbDelete('bans/' + userId); }
  const obj = loadJSON(K_LOCAL_BANS, {});
  delete obj[userId];
  safeSet(K_LOCAL_BANS, JSON.stringify(obj));
}

/* edits + layout */
function loadEdits(){ return loadJSON(K_EDITS, {}); }
function saveEdits(o){ safeSet(K_EDITS, JSON.stringify(o)); }
function loadLayout(){ return loadJSON(K_LAYOUT, {}); }
function saveLayoutStore(o){ safeSet(K_LAYOUT, JSON.stringify(o)); }

/* перенос локальных в облако */
async function mergeLocalIntoCloud() {
  if (!FB_READY) return;
  let changed = 0;
  try {
    const lu = loadJSON(K_LOCAL_USERS, []);
    for (const u of lu) if (u && u.id && !FB_DATA.users[u.id]) { FB_DATA.users[u.id] = u; await fbPut('users/' + u.id, u); changed++; }
  } catch(e){}
  try {
    const lr = loadJSON(K_LOCAL_REVIEWS, []);
    for (const r of lr) if (r && r.id && !FB_DATA.reviews[r.id]) { FB_DATA.reviews[r.id] = r; await fbPut('reviews/' + r.id, r); changed++; }
  } catch(e){}
  try {
    const lc = loadJSON(K_LOCAL_CHAT, []);
    for (const m of lc) if (m && m.id && !FB_DATA.chat[m.id]) { FB_DATA.chat[m.id] = m; await fbPut('chat/' + m.id, m); changed++; }
  } catch(e){}
  if (changed) console.log('[FB] migrated:', changed);
}

/* ============================================================
   UTILS
   ============================================================ */
function hashPassword(pwd) {
  let h = 5381; const s = 'vf::' + pwd + '::salt';
  for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h &= h; }
  return 'h' + Math.abs(h).toString(36);
}
function getSessionUserId(){ return safeGet(K_SESSION); }
function setSession(id){ id ? safeSet(K_SESSION, id) : safeRemove(K_SESSION); }
function getCurrentUser(){
  const id = getSessionUserId();
  return id ? loadUsers().find(u => u.id === id) || null : null;
}
function initialsOf(n){ n = String(n||'').trim(); return n ? n.slice(0,2).toUpperCase() : '?'; }
function isCreatorName(n){ return String(n||'').toLowerCase() === CREATOR_NICKNAME; }
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function renderNameWithBadges(u, cls) {
  if (!u) return '';
  let html = `<span class="${cls || 'rn-text'}">${escapeHtml(u.nickname)}</span>`;
  if (u.isAdmin) html += ` <span class="verified-badge" title="Администратор">✓</span>`;
  if (u.isCreator) html += ` <span class="creator-tag">Создатель</span>`;
  return html;
}
function renderAvatar(el, u) {
  if (!el) return;
  if (u && u.avatar) el.innerHTML = `<img src="${u.avatar}" alt="">`;
  else el.textContent = initialsOf(u ? u.nickname : '?');
}

/* ============================================================
   TABS
   ============================================================ */
function switchTab(id, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const t = document.getElementById('panel-' + id);
  if (t) t.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el && el.classList) el.classList.add('active');
  if (id === 'reviews') syncReviewsForm();
}

/* ============================================================
   BANS
   ============================================================ */
function isUserBanned(userId) {
  const bans = loadBans();
  const b = bans[userId];
  if (!b) return null;
  if (b.until === 'forever') return b;
  if (Date.now() < b.until) return b;
  deleteBan(userId);
  return null;
}
function formatBanUntil(until) {
  if (until === 'forever') return 'НАВСЕГДА';
  try {
    const d = new Date(until);
    const diff = Math.max(0, until - Date.now());
    const days = Math.floor(diff/86400000);
    const hours = Math.floor((diff%86400000)/3600000);
    const mins = Math.floor((diff%3600000)/60000);
    let left = '';
    if (days > 0) left = `${days} д. ${hours} ч.`;
    else if (hours > 0) left = `${hours} ч. ${mins} мин.`;
    else left = `${mins} мин.`;
    return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} (осталось ${left})`;
  } catch (e) { return '—'; }
}
function checkBan() {
  const me = getCurrentUser();
  if (!me) return false;
  const ban = isUserBanned(me.id);
  if (ban) {
    document.getElementById('banUntil').textContent = formatBanUntil(ban.until);
    if (ban.reason) {
      document.getElementById('banReasonRow').style.display = '';
      document.getElementById('banReason').textContent = ban.reason;
    }
    document.getElementById('banOverlay').classList.add('show');
    document.body.classList.add('ban-locked');
    try { bgMusic.pause(); } catch(e){}
    return true;
  }
  return false;
}

/* ============================================================
   AUTH
   ============================================================ */
function migrate() {
  const users = loadUsers(); let changed = false;
  users.forEach(u => {
    if (isCreatorName(u.nickname) && (!u.isAdmin || !u.isCreator)) {
      u.isAdmin = true; u.isCreator = true; saveUser(u); changed = true;
    }
  });
  return changed;
}

function updateAuthUI() {
  const u = getCurrentUser();
  const authBtn = document.getElementById('authBtn');
  const userChip = document.getElementById('userChip');
  const miniAv = document.getElementById('userAvatarMini');
  const miniName = document.getElementById('userNameMini');
  if (u) {
    authBtn.style.display = 'none';
    userChip.style.display = '';
    miniName.innerHTML = renderNameWithBadges(u, 'uc-name');
    renderAvatar(miniAv, u);
  } else {
    authBtn.style.display = '';
    userChip.style.display = 'none';
    if (typeof editModeActive !== 'undefined' && editModeActive) disableEditMode();
    if (typeof interfaceManageActive !== 'undefined' && interfaceManageActive) disableInterfaceManage();
  }
  syncReviewsForm();
  updateChatLockUI();
}

const authModal = document.getElementById('authModal');
const profileModal = document.getElementById('profileModal');
const adminModal = document.getElementById('adminModal');
const banModal = document.getElementById('banModal');
const bansModal = document.getElementById('bansModal');
const chatModal = document.getElementById('chatModal');

function openAuth(tab) {
  authModal.classList.add('open');
  document.body.classList.add('modal-open');
  switchAuthTab(tab === 'register' ? 'register' : 'login');
}
function closeAuth() {
  authModal.classList.remove('open');
  document.body.classList.remove('modal-open');
  document.getElementById('loginMsg').classList.remove('show');
  document.getElementById('regMsg').classList.remove('show');
}
function switchAuthTab(tab) {
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
  document.getElementById('registerForm').classList.toggle('active', tab === 'register');
}
document.querySelectorAll('.modal-tab').forEach(t => t.addEventListener('click', () => switchAuthTab(t.dataset.tab)));
authModal.addEventListener('click', e => { if (e.target === authModal) closeAuth(); });

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const nick = document.getElementById('loginNick').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  const msg = document.getElementById('loginMsg');
  if (!nick || !pwd) { msg.textContent = 'Заполни ник и пароль'; msg.className = 'modal-msg show err'; return; }
  await fbLoadAll();
  const users = loadUsers();
  const user = users.find(u => u.nickname.toLowerCase() === nick.toLowerCase());
  if (!user) { msg.textContent = 'Пользователь не найден'; msg.className = 'modal-msg show err'; return; }
  if (user.passwordHash !== hashPassword(pwd)) { msg.textContent = 'Неверный пароль'; msg.className = 'modal-msg show err'; return; }
  if (isUserBanned(user.id)) {
    msg.textContent = 'Ваш аккаунт заблокирован';
    msg.className = 'modal-msg show err';
    closeAuth(); setTimeout(checkBan, 100);
    return;
  }
  setSession(user.id);
  msg.textContent = 'Добро пожаловать, ' + user.nickname + '!';
  msg.className = 'modal-msg show ok';
  updateAuthUI(); renderReviews(); renderChat();
  setTimeout(() => closeAuth(), 700);
  document.getElementById('loginForm').reset();
});

document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const nick = document.getElementById('regNick').value.trim();
  const pwd = document.getElementById('regPwd').value;
  const msg = document.getElementById('regMsg');
  if (nick.length < 2) { msg.textContent = 'Ник слишком короткий (мин. 2)'; msg.className = 'modal-msg show err'; return; }
  if (pwd.length < 4) { msg.textContent = 'Пароль минимум 4 символа'; msg.className = 'modal-msg show err'; return; }
  await fbLoadAll();
  const users = loadUsers();
  if (users.some(u => u.nickname.toLowerCase() === nick.toLowerCase())) {
    msg.textContent = 'Такой ник уже занят'; msg.className = 'modal-msg show err'; return;
  }
  const isCreator = isCreatorName(nick);
  const user = {
    id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    nickname: nick,
    passwordHash: hashPassword(pwd),
    avatar: null,
    createdAt: new Date().toISOString(),
    isAdmin: isCreator,
    isCreator: isCreator
  };
  saveUser(user);
  setSession(user.id);
  msg.textContent = isCreator ? '👑 Добро пожаловать, Создатель!' : 'Аккаунт создан!';
  msg.className = 'modal-msg show ok';
  updateAuthUI(); renderReviews(); renderChat();
  setTimeout(() => closeAuth(), 900);
  document.getElementById('registerForm').reset();
});

function openProfile() {
  const u = getCurrentUser();
  if (!u) { openAuth(); return; }
  document.getElementById('profileNick').value = u.nickname;
  renderAvatar(document.getElementById('profileAvatar'), u);
  document.getElementById('profileMsg').classList.remove('show');
  document.getElementById('adminTools').style.display = u.isAdmin ? '' : 'none';
  document.getElementById('creatorTools').style.display = u.isCreator ? '' : 'none';
  const editBtn = document.getElementById('editModeBtn');
  if (editBtn) {
    editBtn.classList.toggle('active', editModeActive);
    editBtn.textContent = editModeActive ? '✏️ Режим редактирования ВКЛ' : '✏️ Режим редактирования';
  }
  const ifBtn = document.getElementById('interfaceManageBtn');
  if (ifBtn) {
    ifBtn.classList.toggle('active', interfaceManageActive);
    ifBtn.textContent = interfaceManageActive ? '🎨 Управление Интерфейсом ВКЛ' : '🎨 Управление Интерфейсом';
  }
  profileModal.classList.add('open');
  document.body.classList.add('modal-open');
}
function closeProfile() { profileModal.classList.remove('open'); document.body.classList.remove('modal-open'); }
profileModal.addEventListener('click', e => { if (e.target === profileModal) closeProfile(); });

document.getElementById('avatarInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showProfileMsg('Нужно выбрать изображение', 'err'); return; }
  if (file.size > 8 * 1024 * 1024) { showProfileMsg('Файл слишком большой (макс 8 МБ)', 'err'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const size = 200, canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide)/2, sy = (img.height - minSide)/2;
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      const u = getCurrentUser(); if (!u) return;
      u.avatar = dataUrl;
      saveUser(u);
      renderAvatar(document.getElementById('profileAvatar'), u);
      updateAuthUI(); renderReviews(); renderChat();
      showProfileMsg('Аватарка обновлена', 'ok');
    };
    img.onerror = () => showProfileMsg('Не удалось прочитать изображение', 'err');
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

function removeAvatar() {
  const u = getCurrentUser(); if (!u) return;
  u.avatar = null; saveUser(u);
  renderAvatar(document.getElementById('profileAvatar'), u);
  updateAuthUI(); renderReviews(); renderChat();
  showProfileMsg('Аватарка удалена', 'ok');
}

async function saveProfile() {
  const u = getCurrentUser(); if (!u) return;
  const newNick = document.getElementById('profileNick').value.trim();
  if (newNick.length < 2) { showProfileMsg('Ник слишком короткий', 'err'); return; }
  await fbLoadAll();
  const users = loadUsers();
  if (users.some(x => x.id !== u.id && x.nickname.toLowerCase() === newNick.toLowerCase())) {
    showProfileMsg('Этот ник уже занят', 'err'); return;
  }
  u.nickname = newNick;
  if (isCreatorName(newNick)) { u.isAdmin = true; u.isCreator = true; }
  saveUser(u);
  updateAuthUI(); renderReviews(); renderChat();
  showProfileMsg('Профиль сохранён', 'ok');
}
function showProfileMsg(text, type) {
  const msg = document.getElementById('profileMsg');
  msg.textContent = text; msg.className = 'modal-msg show ' + type;
  clearTimeout(showProfileMsg._t);
  showProfileMsg._t = setTimeout(() => msg.classList.remove('show'), 3000);
}
function logout() {
  setSession(null);
  closeProfile();
  updateAuthUI(); renderReviews(); renderChat();
  if (editModeActive) disableEditMode();
  if (interfaceManageActive) disableInterfaceManage();
}

/* ============================================================
   ADMIN PANEL
   ============================================================ */
async function openAdminPanel() {
  const me = getCurrentUser();
  if (!me || !me.isAdmin) return;
  await fbLoadAll();
  renderAdminUsers(); renderAdminBans();
  adminModal.classList.add('open');
  document.body.classList.add('modal-open');
}
function closeAdminPanel() { adminModal.classList.remove('open'); document.body.classList.remove('modal-open'); }
adminModal.addEventListener('click', e => { if (e.target === adminModal) closeAdminPanel(); });

function openBansModal() {
  const me = getCurrentUser();
  if (!me || !me.isAdmin) return;
  renderBansModal();
  bansModal.classList.add('open');
  document.body.classList.add('modal-open');
}
function closeBansModal() { bansModal.classList.remove('open'); document.body.classList.remove('modal-open'); }
bansModal.addEventListener('click', e => { if (e.target === bansModal) closeBansModal(); });

function renderAdminUsers() {
  const me = getCurrentUser();
  if (!me || !me.isAdmin) return;
  const users = loadUsers();
  const bans = loadBans();
  const list = document.getElementById('adminUsersList');
  const countEl = document.getElementById('adminUsersCount');
  if (countEl) countEl.textContent = users.length;
  if (!users.length) {
    list.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-mute);font-size:.85rem;border:1px dashed rgba(255,255,255,.1);border-radius:12px;">Пользователей пока нет</div>`;
    return;
  }
  const sorted = users.slice().sort((a, b) => {
    if (a.isCreator && !b.isCreator) return -1;
    if (!a.isCreator && b.isCreator) return 1;
    if (a.id === me.id && b.id !== me.id) return -1;
    if (a.id !== me.id && b.id === me.id) return 1;
    if (a.isAdmin && !b.isAdmin) return -1;
    if (!a.isAdmin && b.isAdmin) return 1;
    return (a.createdAt || '') > (b.createdAt || '') ? -1 : 1;
  });
  list.innerHTML = sorted.map(u => {
    const isCreator = !!u.isCreator;
    const isMe = u.id === me.id;
    const ban = bans[u.id];
    const isBanned = !!ban && (ban.until === 'forever' || Date.now() < ban.until);
    const adminToggleDisabled = isCreator || isMe;
    const banBtnDisabled = isCreator || isMe;

async function confirmBan() {

function deleteUser(userId) {

function formatDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  } catch(e){ return ''; }
}

const EDITABLE_SELECTORS = '.hero-title, .hero-lead, .panel-head h2, .panel-head p, .card h3, .card p, .hero-eyebrow, .video-label, .footer span, .review-form-title, .review-form-hint';

function enableEditMode() {
  document.querySelectorAll(EDITABLE_SELECTORS).forEach(el => {
    el.setAttribute('data-vf-editable', '1');
    el.setAttribute('contenteditable', 'true');
    el.addEventListener('blur', onEditBlur);
  });
}
function disableEditMode() {
  editModeActive = false;
  document.querySelectorAll('[data-vf-editable="1"]').forEach(el => {
    el.removeAttribute('data-vf-editable');
    el.removeAttribute('contenteditable');

  });
}
function onEditBlur(e) {
  const el = e.target;
  const edits = loadEdits();
  // Ищем уникальный селектор
  let sel = null;
  for (const s of EDITABLE_SELECTORS.split(',')) {
    s = s.trim();

  }
  if (!sel) return;
  edits[sel] = el.innerHTML;

}

let interfaceManageActive = false;
function toggleInterfaceManage() {
  const me = getCurrentUser();
  if (!me || !me.isCreator) return;
  interfaceManageActive = !interfaceManageActive;
  if (interfaceManageActive) enableInterfaceManage();
  else disableInterfaceManage();

  if (btn) {
    btn.classList.toggle('active', interfaceManageActive);
    btn.textContent = interfaceManageActive ? '🎨 Управление Интерфейсом ВКЛ' : '🎨 Управление Интерфейсом';
  }
}
function enableInterfaceManage() {
  applyLayout();
  document.querySelectorAll('[data-drag-container]').forEach(cont => {
    cont.querySelectorAll('.card').forEach(card => {
      card.setAttribute('draggable', 'true');
      card.classList.add('drag-enabled');
      card.addEventListener('dragstart', onDragStart);
      card.addEventListener('dragend', onDragEnd);
      card.addEventListener('dragover', onDragOver);
      card.addEventListener('dragleave', onDragLeave);
      card.addEventListener('drop', onDrop);
    });
  });
}
function disableInterfaceManage() {
  interfaceManageActive = false;
  document.querySelectorAll('[data-drag-container] .card').forEach(card => {
    card.removeAttribute('draggable');
    card.classList.remove('drag-enabled', 'dragging', 'drag-over');
    card.removeEventListener('dragstart', onDragStart);
    card.removeEventListener('dragend', onDragEnd);
    card.removeEventListener('dragover', onDragOver);
    card.removeEventListener('dragleave', onDragLeave);
    card.removeEventListener('drop', onDrop);
  });
}
let dragSrc = null;
function onDragStart(e) {
  dragSrc = this;
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEnd() {
  this.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  saveLayoutOrder();
}
function onDragOver(e) {
  e.preventDefault();
  if (this === dragSrc) return;
  this.classList.add('drag-over');
}
function onDragLeave() {
  this.classList.remove('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  this.classList.remove('drag-over');
  if (this === dragSrc) return;
  const parent = this.parentNode;
  const cards = Array.from(parent.children);
  const srcIdx = cards.indexOf(dragSrc);
  const dstIdx = cards.indexOf(this);
  if (srcIdx < 0 || dstIdx < 0) return;
  if (srcIdx < dstIdx) parent.insertBefore(dragSrc, this.nextSibling);
  else parent.insertBefore(dragSrc, this);
  saveLayoutOrder();
}
function saveLayoutOrder() {
  const layout = {};
  document.querySelectorAll('[data-drag-container]').forEach(cont => {
    const key = cont.dataset.dragContainer;
    const order = Array.from(cont.querySelectorAll('.card')).map(c => c.querySelector('h3') ? c.querySelector('h3').textContent.trim() : '');
    layout[key] = order;
  });
  saveLayoutStore(layout);
}
function applyLayout() {
  const layout = loadLayout();
  Object.keys(layout).forEach(key => {
    const cont = document.querySelector(`[data-drag-container="${key}"]`);
    if (!cont) return;
    const order = layout[key];
    const cards = Array.from(cont.querySelectorAll('.card'));
    const map = {};
    cards.forEach(c => { const t = c.querySelector('h3') ? c.querySelector('h3').textContent.trim() : ''; map[t] = c; });
    order.forEach(title => { if (map[title]) cont.appendChild(map[title]); });
  });
}

function exportData() {
  const me = getCurrentUser();
  if (!me || !me.isCreator) return;
  const data = {
    exportedAt: new Date().toISOString(),
    users: loadUsers(),
    reviews: loadReviews(),
    chat: loadChat(),
    bans: loadBans(),
    edits: loadEdits(),
    layout: loadLayout()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vipfirestorm-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
async function importData(input) {
  const me = getCurrentUser();
  if (!me || !me.isCreator) return;
  const file = input.files && input.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!confirm('Импортировать данные? Текущие записи будут дополнены.')) return;
    if (Array.isArray(data.users)) data.users.forEach(saveUser);
    if (Array.isArray(data.reviews)) data.reviews.forEach(saveReview);
    if (Array.isArray(data.chat)) data.chat.forEach(saveMessage);
    if (data.bans && typeof data.bans === 'object') {
      Object.keys(data.bans).forEach(uid => saveBan(uid, data.bans[uid]));
    }
    if (data.edits && typeof data.edits === 'object') saveEdits(data.edits);
    if (data.layout && typeof data.layout === 'object') saveLayoutStore(data.layout);
    applyEdits(); applyLayout();
    renderReviews(); renderChat(); updateAuthUI();
    alert('Импорт завершён!');
  } catch (e) {
    alert('Ошибка импорта: ' + e.message);
  }
  input.value = '';
}

/* ============================================================
   MUSIC
   ============================================================ */
const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
const volumeSlider = document.getElementById('volumeSlider');
const volVal = document.getElementById('volVal');
const musicIconOff = document.getElementById('musicIconOff');
const musicIconOn = document.getElementById('musicIconOn');
let musicStarted = false;

if (musicBtn) musicBtn.addEventListener('click', () => {
  if (!musicStarted) {
    bgMusic.volume = (volumeSlider ? parseInt(volumeSlider.value,10) : 50) / 100;
    bgMusic.play().then(() => {
      musicStarted = true;
      musicBtn.classList.add('playing');
      if (musicIconOff) musicIconOff.style.display = 'none';
      if (musicIconOn) musicIconOn.style.display = '';
    }).catch(() => {});
  } else {
    if (bgMusic.paused) {
      bgMusic.play();
      musicBtn.classList.add('playing');
      if (musicIconOff) musicIconOff.style.display = 'none';
      if (musicIconOn) musicIconOn.style.display = '';
    } else {
      bgMusic.pause();
      musicBtn.classList.remove('playing');
      if (musicIconOff) musicIconOff.style.display = '';
      if (musicIconOn) musicIconOn.style.display = 'none';
    }
  }
});
if (volumeSlider) volumeSlider.addEventListener('input', () => {
  const v = parseInt(volumeSlider.value, 10);
  if (volVal) volVal.textContent = v + '%';
  bgMusic.volume = v / 100;
});

/* ============================================================
   PARALLAX BG
   ============================================================ */
const bgImage = document.getElementById('bgImage');
let mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 20;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 20;
  if (bgImage) bgImage.style.transform = `translate(${mouseX}px, ${mouseY}px)`;
});

/* ============================================================
   EMBERS (частицы)
   ============================================================ */
(function initEmbers() {
  const cvs = document.getElementById('embers');
  if (!cvs) return;
  const ctx = cvs.getContext('2d');
  let w, h, particles = [];
  function resize() {
    w = cvs.width = window.innerWidth;
    h = cvs.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 2 + 0.6,
      vy: -(Math.random() * 0.5 + 0.2),
      vx: (Math.random() - 0.5) * 0.3,
      a: Math.random() * 0.5 + 0.2
    });
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
      grad.addColorStop(0, `rgba(255,140,80,${p.a})`);
      grad.addColorStop(1, 'rgba(255,80,40,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ============================================================
   DOWNLOAD COUNTER (сохраняется локально)
   ============================================================ */
(function initDownloads() {
  const K = 'vf_downloads_v1';
  let n = parseInt(safeGet(K) || '6', 10) || 6;
  document.querySelectorAll('.js-download').forEach(a => {
    a.addEventListener('click', () => {
      n++;
      safeSet(K, String(n));
      document.querySelectorAll('[data-count]').forEach(el => el.textContent = n);
    });
  });
  document.querySelectorAll('[data-count]').forEach(el => el.textContent = n);
})();

/* ============================================================
   POLLING
   ============================================================ */
function startPolling() {
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  POLL_TIMER = setInterval(async () => {
    const ok = await fbLoadAll();
    if (ok) {
      renderChat();
      renderReviews();
      const adminM = document.getElementById('adminModal');
      const bansM = document.getElementById('bansModal');
      if (adminM && adminM.classList.contains('open')) { renderAdminUsers(); renderAdminBans(); }
      if (bansM && bansM.classList.contains('open')) renderBansModal();
      updateAuthUI();
      checkBan();
    }
  }, POLL_MS);
}

(async function init() {

  updateAuthUI();
  renderReviews();

})();
